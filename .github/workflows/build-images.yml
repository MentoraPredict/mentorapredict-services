name: Build service images

on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      servicio:
        description: Service directory or ALL-SERVICES (sample-service excluded)
        required: true
        type: string
        default: ALL-SERVICES
  workflow_call:
    inputs:
      servicio:
        description: Service directory or ALL-SERVICES (sample-service excluded)
        required: false
        type: string
        default: ALL-SERVICES

permissions:
  contents: read

jobs:
  changes:
    name: Select services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.servicios }}
      missing: ${{ steps.select.outputs.sin_dockerfile }}
      test_targets: ${{ steps.select.outputs.pruebas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test image selection
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - id: select
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          SERVICIO: ${{ inputs.servicio }}
        run: python3 .github/scripts/detect-image-services.py >> "$GITHUB_OUTPUT"
      - name: Summarize selection
        env:
          SERVICES: ${{ steps.select.outputs.servicios }}
          MISSING: ${{ steps.select.outputs.sin_dockerfile }}
          TEST_TARGETS: ${{ steps.select.outputs.pruebas }}
        run: |
          {
            echo '## Image build selection'
            printf -- '- Services with a Dockerfile: `%s`\n' "$SERVICES"
            printf -- '- Services without a Dockerfile: `%s`\n' "$MISSING"
            printf -- '- CI test targets: `%s`\n' "$TEST_TARGETS"
            echo 'Each service owner is responsible for its Dockerfile.'
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: CI (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.test_targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.test_targets) }}
    uses: ./.github/workflows/ci.yml
    with:
      servicio: ${{ matrix.service }}

  build:
    name: Build (${{ matrix.service }})
    needs: [changes, tests]
    if: needs.tests.result == 'success' && needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build OCI image for amd64
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.service }}.tar
          # mode=max also stores the intermediate stages, where the dependency layer lives.
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,scope=image-${{ matrix.service }},mode=max
      - name: Scan the built image
        env:
          ARCHIVE: ${{ runner.temp }}/${{ matrix.service }}.tar
          DIGEST: ${{ steps.build.outputs.digest }}
          REPORTS: ${{ runner.temp }}/scan-reports
        run: |
          test -n "$DIGEST"
          python3 .github/scripts/scan-security.py image "$ARCHIVE" \
            --expected-digest "$DIGEST" --reports "$REPORTS"
      - name: Keep the scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/scan-reports
          if-no-files-found: warn
          retention-days: 14
      # Runs only if the scan passed, so later stages cannot receive a blocked image.
      - name: Preserve image for subsequent pipeline stages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish (${{ matrix.service }})
    needs: [changes, tests, build]
    if: >-
      needs.build.result == 'success' &&
      needs.changes.outputs.services != '[]' &&
      github.ref == 'refs/heads/qa' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download scanned OCI archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/scanned-image
      - name: Download scan identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scan-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/scan-identity
      - name: Install image copy tool
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
      - name: Publish the verified image to ECR
        env:
          A_AWS_ACCESS_KEY_ID: ${{ secrets.A_AWS_ACCESS_KEY_ID }}
          A_AWS_SECRET_ACCESS_KEY: ${{ secrets.A_AWS_SECRET_ACCESS_KEY }}
          A_AWS_SESSION_TOKEN: ${{ secrets.A_AWS_SESSION_TOKEN }}
          A_AWS_REGION: ${{ vars.A_AWS_REGION }}
          A_AWS_ACCOUNT_ID: ${{ vars.A_AWS_ACCOUNT_ID }}
          B_AWS_ACCESS_KEY_ID: ${{ secrets.B_AWS_ACCESS_KEY_ID }}
          B_AWS_SECRET_ACCESS_KEY: ${{ secrets.B_AWS_SECRET_ACCESS_KEY }}
          B_AWS_SESSION_TOKEN: ${{ secrets.B_AWS_SESSION_TOKEN }}
          B_AWS_REGION: ${{ vars.B_AWS_REGION }}
          B_AWS_ACCOUNT_ID: ${{ vars.B_AWS_ACCOUNT_ID }}
          C_AWS_ACCESS_KEY_ID: ${{ secrets.C_AWS_ACCESS_KEY_ID }}
          C_AWS_SECRET_ACCESS_KEY: ${{ secrets.C_AWS_SECRET_ACCESS_KEY }}
          C_AWS_SESSION_TOKEN: ${{ secrets.C_AWS_SESSION_TOKEN }}
          C_AWS_REGION: ${{ vars.C_AWS_REGION }}
          C_AWS_ACCOUNT_ID: ${{ vars.C_AWS_ACCOUNT_ID }}
          SERVICE: ${{ matrix.service }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/publish-ecr-accounts.py \
            --archive "$RUNNER_TEMP/scanned-image/$SERVICE.tar" \
            --identity "$RUNNER_TEMP/scan-identity/image-identity.txt" \
            --service "$SERVICE" --commit "$COMMIT" \
            --account AUTO --evidence "$RUNNER_TEMP/publication/image.json"
      - name: Keep publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/publication/image.json
          if-no-files-found: error
          retention-days: 14

  result:
    name: Image build result
    if: always()
    needs: [changes, tests, build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selection and image builds
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SERVICES: ${{ needs.changes.outputs.services }}
          TEST_TARGETS: ${{ needs.changes.outputs.test_targets }}
          MISSING: ${{ needs.changes.outputs.missing }}
        run: |
          {
            echo '## Image build result'
            printf -- '- Selection: `%s`\n' "$CHANGES"
            printf -- '- Tests: `%s`\n' "$TESTS"
            printf -- '- Build: `%s`\n' "$BUILD"
            printf -- '- Publication: `%s`\n' "$PUBLISH"
            printf -- '- Missing Dockerfiles: `%s`\n' "${MISSING:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHANGES" = success
          test -n "$MISSING"
          test -n "$SERVICES"
          test -n "$TEST_TARGETS"
          if [ "$MISSING" != '[]' ]; then
            echo "::warning::The following services have no Dockerfile and were not built: $MISSING"
          fi
          if [ "$TEST_TARGETS" = '[]' ]; then
            test "$TESTS" = skipped
          else
            test "$TESTS" = success
          fi
          if [ "$SERVICES" = '[]' ]; then
            test "$BUILD" = skipped
          else
            test "$BUILD" = success
          fi
          if [ "$SERVICES" != '[]' ] && [ "$REF" = 'refs/heads/qa' ] && { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; }; then
            test "$PUBLISH" = success
          else
            test "$PUBLISH" = skipped
          fi
