name: Build service images

on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      servicio:
        description: Service directory or ALL-SERVICES (sample-service excluded)
        required: true
        type: string
        default: ALL-SERVICES
  workflow_call:
    inputs:
      servicio:
        description: Service directory or ALL-SERVICES (sample-service excluded)
        required: false
        type: string
        default: ALL-SERVICES

permissions:
  contents: read

jobs:
  changes:
    name: Select services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.servicios }}
      missing: ${{ steps.select.outputs.sin_dockerfile }}
      test_targets: ${{ steps.select.outputs.pruebas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test image selection
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - id: select
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          SERVICIO: ${{ inputs.servicio }}
        run: python3 .github/scripts/detect-image-services.py >> "$GITHUB_OUTPUT"
      - name: Summarize selection
        env:
          SERVICES: ${{ steps.select.outputs.servicios }}
          MISSING: ${{ steps.select.outputs.sin_dockerfile }}
          TEST_TARGETS: ${{ steps.select.outputs.pruebas }}
        run: |
          {
            echo '## Image build selection'
            printf -- '- Services with a Dockerfile: `%s`\n' "$SERVICES"
            printf -- '- Services without a Dockerfile: `%s`\n' "$MISSING"
            printf -- '- CI test targets: `%s`\n' "$TEST_TARGETS"
            echo 'Each service owner is responsible for its Dockerfile.'
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: CI (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.test_targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.test_targets) }}
    uses: ./.github/workflows/ci.yml
    with:
      servicio: ${{ matrix.service }}

  build:
    name: Build (${{ matrix.service }})
    needs: [changes, tests]
    if: needs.tests.result == 'success' && needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build OCI image for amd64 and arm64
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.service }}.tar
      - name: Preserve image for subsequent pipeline stages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  result:
    name: Image build result
    if: always()
    needs: [changes, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selection and image builds
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          SERVICES: ${{ needs.changes.outputs.services }}
          TEST_TARGETS: ${{ needs.changes.outputs.test_targets }}
          MISSING: ${{ needs.changes.outputs.missing }}
        run: |
          {
            echo '## Image build result'
            printf -- '- Selection: `%s`\n' "$CHANGES"
            printf -- '- Tests: `%s`\n' "$TESTS"
            printf -- '- Build: `%s`\n' "$BUILD"
            printf -- '- Missing Dockerfiles: `%s`\n' "${MISSING:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHANGES" = success
          test -n "$MISSING"
          test -n "$SERVICES"
          test -n "$TEST_TARGETS"
          if [ "$MISSING" != '[]' ]; then
            echo "::warning::The following services have no Dockerfile and were not built: $MISSING"
          fi
          if [ "$TEST_TARGETS" = '[]' ]; then
            test "$TESTS" = skipped
          else
            test "$TESTS" = success
          fi
          if [ "$SERVICES" = '[]' ]; then
            test "$BUILD" = skipped
          else
            test "$BUILD" = success
          fi
