name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      servicio:
        description: Nombre del servicio o ALL-SERVICES (excluye sample-service)
        required: true
        type: string
        default: ALL-SERVICES
  workflow_call:
    inputs:
      servicio:
        description: Nombre del servicio o ALL-SERVICES (excluye sample-service)
        required: false
        type: string
        default: ALL-SERVICES

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.servicio || 'auto' }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      proyectos: ${{ steps.detectar.outputs.proyectos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detectar
        name: Seleccionar proyectos afectados
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SERVICIO: ${{ inputs.servicio }}
        run: python3 .github/scripts/detect-ci-changes.py >> "$GITHUB_OUTPUT"

  pruebas:
    name: Pruebas (${{ matrix.proyecto }})
    needs: cambios
    if: needs.cambios.outputs.proyectos != '[]'
    strategy:
      fail-fast: false
      matrix:
        proyecto: ${{ fromJSON(needs.cambios.outputs.proyectos) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y ejecutar pruebas
        env:
          PROYECTO: ${{ matrix.proyecto }}
        run: |
          if [ "$PROYECTO" = ALL-SERVICES ]; then
            ./gradlew build integrationTest --no-daemon \
              -x :services:sample-service:build \
              -x :services:sample-service:integrationTest
          else
            ./gradlew ":services:$PROYECTO:build" ":services:$PROYECTO:integrationTest" --no-daemon
          fi
      - name: Guardar reportes si falla el trabajo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci-${{ matrix.proyecto }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Resumir el resultado del proyecto
        if: always()
        env:
          PROYECTO: ${{ matrix.proyecto }}
          ESTADO: ${{ job.status }}
        run: |
          {
            echo '## Resultado de pruebas'
            printf -- '- Proyecto: `%s`\n' "$PROYECTO"
            printf -- '- Resultado: `%s`\n' "$ESTADO"
            echo '- Los reportes disponibles se guardan como artefacto si el trabajo falla.'
          } >> "$GITHUB_STEP_SUMMARY"

  resultado:
    name: Resultado de CI
    if: always()
    needs: [cambios, pruebas]
    runs-on: ubuntu-latest
    steps:
      - name: Resumir los proyectos seleccionados
        env:
          PROYECTOS: ${{ needs.cambios.outputs.proyectos }}
          CAMBIOS: ${{ needs.cambios.result }}
          PRUEBAS: ${{ needs.pruebas.result }}
        run: |
          {
            echo '## Resumen de CI'
            printf -- '- Proyectos seleccionados: `%s`\n' "${PROYECTOS:-no disponibles}"
            printf -- '- Detección de cambios: `%s`\n' "$CAMBIOS"
            printf -- '- Resultado global de pruebas: `%s`\n' "$PRUEBAS"
            echo '- Cada trabajo de la matriz muestra el resultado de su proyecto.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verificar el resultado
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          PRUEBAS: ${{ needs.pruebas.result }}
        run: |
          test "$CAMBIOS" = success
          test "$PRUEBAS" = success || test "$PRUEBAS" = skipped
